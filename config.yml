# ============================================================
# アプリ設定ファイル
# ============================================================

design:
  theme: "dark"

features:
  trains: true
  buses: true
  delays: true

trains:
  station_id: 17
  min_minutes_until: 15
  max_trains_per_direction: 6
  leading_delay_threshold: 10  # 先着列車がこの分数以上遅延した場合、後続の未発車列車の時刻をハイフン表示

buses:
  stop_name: "同志社香里"
  stop_numbers:
    - 1
    - 2

delays:
  source: "yahoo"
  use_ai: true

intervals:
  train_seconds: 60
  bus_seconds: 60
  delay_seconds: 600
