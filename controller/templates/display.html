<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>サイネージ</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;400;500;700&amp;display=swap"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0B0B0C}iframe{width:100%;height:100%;border:0;display:block}iframe.next{position:fixed;inset:0;opacity:0;pointer-events:none}[hidden]{display:none!important}#reconnecting-screen{position:fixed;inset:0;z-index:9999;background:#0B0B0C;overflow:hidden}#reconnecting-content{position:absolute;left:0;top:0;transform-origin:top left}@keyframes spin{to{transform:rotate(360deg)}}.attempt{display:flex;align-items:center;gap:20px;height:34px;font-size:19px;line-height:1}.attempt-detail{color:#A1A1A6;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:1}
#clock-time, #clock-seconds { display:inline-flex; flex-shrink:0; letter-spacing:0; white-space:nowrap; }
.clock-digit { display:inline-block; flex:0 0 .58em; width:.58em; text-align:center; }
.clock-separator { display:inline-block; flex:0 0 .22em; width:.22em; text-align:center; }
</style></head><body><iframe id="f" src="/transit/"></iframe>
<div id="reconnecting-screen" hidden="">
<div style="width: 1920px; height: 1080px; box-sizing: border-box; padding: 44px 56px; display: flex; flex-direction: column; background: #0B0B0C; color: #F1F1EE; font-family: 'Zen Kaku Gothic New', sans-serif; font-variant-numeric: tabular-nums; overflow: hidden" id="reconnecting-content">

<header style="flex-shrink: 0; height: 104px; display: flex; align-items: flex-end; justify-content: space-between; padding-bottom: 24px; border-bottom: 1px solid #26262A">
<div></div>
<div style="display: flex; align-items: flex-end; gap: 28px">
<div style="font-size: 20px; font-weight: 400; color: #A1A1A6; letter-spacing: 0.08em; padding-bottom: 10px" id="clock-date">11.06 金</div>
<div style="display: flex; align-items: baseline; gap: 4px; line-height: 0.9">
<span style="font-size: 92px; font-weight: 300; letter-spacing: -0.02em" id="clock-time">12:09</span>
<span style="font-size: 36px; font-weight: 300; color: #7C7C82" id="clock-seconds">:36</span>
</div>
</div>
</header>

<main style="flex: 1; min-height: 0; display: flex; flex-direction: column; padding-top: 88px">

<div style="display: flex; align-items: center; gap: 40px">
<span style="display: inline-block; flex-shrink: 0; width: 84px; height: 84px; box-sizing: border-box; border: 5px solid #26262A; border-top-color: #F1F1EE; border-radius: 50%; animation: spin 1s linear infinite"></span>
<div>
<div style="font-size: 56px; font-weight: 500; line-height: 1">サーバーに再接続しています</div>
<div style="margin-top: 22px; font-size: 24px; color: #A1A1A6; line-height: 1">つながりしだい、自動で列車とバスの表示に戻ります。</div>
</div>
</div>

<div style="display: flex; gap: 40px; margin-top: 80px; padding-left: 124px">
<div style="width: 360px"><div style="font-size: 18px; color: #7C7C82; line-height: 1">再試行</div><div style="margin-top: 18px; display: flex; align-items: baseline; gap: 6px; line-height: 1"><span style="font-size: 72px; font-weight: 300" id="retry-count">7</span><span style="font-size: 24px; color: #A1A1A6">回目</span></div><div style="margin-top: 16px; font-size: 18px; color: #A1A1A6; line-height: 1; height: 18px">15秒ごとに確認</div></div>
<div style="width: 360px"><div style="font-size: 18px; color: #7C7C82; line-height: 1">次の再試行まで</div><div style="margin-top: 18px; display: flex; align-items: baseline; gap: 6px; line-height: 1"><span style="font-size: 72px; font-weight: 300" id="next-retry">6</span><span style="font-size: 24px; color: #A1A1A6">秒</span></div><div style="margin-top: 16px; font-size: 18px; color: #A1A1A6; line-height: 1; height: 18px"><div style="position: relative; width: 300px; height: 4px; background: #26262A; border-radius: 2px; top: 6px"><div style="position: absolute; inset: 0 auto 0 0; width: 60%; background: #F1F1EE; border-radius: 2px" id="retry-progress"></div></div></div></div>
<div style="width: 360px"><div style="font-size: 18px; color: #7C7C82; line-height: 1">途切れてから</div><div style="margin-top: 18px; display: flex; align-items: baseline; gap: 6px; line-height: 1"><span id="elapsed-minutes" style="font-size:72px;font-weight:300">0</span><span style="font-size:24px;color:#A1A1A6">分</span><span id="elapsed-seconds" style="font-size:72px;font-weight:300">0</span><span style="font-size:24px;color:#A1A1A6">秒</span></div><div style="margin-top: 16px; font-size: 18px; color: #A1A1A6; line-height: 1; height: 18px"><span style="color: #F1F1EE" id="failure-since">12:07:57</span> から</div></div>
</div>

<div style="margin-top: auto; display: flex; gap: 56px; padding: 32px 36px; background: #151517; border-radius: 4px">
<div style="flex: 1; display: flex; flex-direction: column; gap: 14px">
<div style="font-size: 20px; font-weight: 500; line-height: 1; padding-bottom: 14px; border-bottom: 1px solid #26262A">いまの状態</div>
<div style="display: flex; gap: 24px; line-height: 1.4"><div style="width: 136px; flex-shrink: 0; font-size: 19px; color: #7C7C82">原因</div><div style="font-size: 21px"><span style="color: #FF5B2E; font-weight: 500" id="failure-cause">表示サーバー（transit）が応答しません</span></div></div>
<div style="display: flex; gap: 24px; line-height: 1.4"><div style="width: 136px; flex-shrink: 0; font-size: 19px; color: #7C7C82"></div><div style="font-size: 21px"><span style="color: #A1A1A6; font-size: 19px" id="failure-description">中継（controller）までは届いています。transit が止まっているか、再起動中です。</span></div></div>
<div style="display: flex; gap: 24px; line-height: 1.4"><div style="width: 136px; flex-shrink: 0; font-size: 19px; color: #7C7C82">確認先</div><div style="font-size: 21px" id="check-target">/transit</div></div>
<div style="display: flex; gap: 24px; line-height: 1.4"><div style="width: 136px; flex-shrink: 0; font-size: 19px; color: #7C7C82">最後に正常</div><div style="font-size: 21px" id="last-ok">12:07:42</div></div>
</div>
<div style="width: 640px; flex-shrink: 0">
<div style="font-size: 20px; font-weight: 500; line-height: 1; padding-bottom: 14px; border-bottom: 1px solid #26262A; margin-bottom: 8px">試行の記録（新しい順）</div>

<div id="attempts"></div></div>
</div>

</main>
</div>
</div>
<script>
var currentMode = 'transit';
var lastOk = Date.now();
var firstFailure = null;
var failures = 0;
var attempts = [];
var TIMEOUT_MS = 60000;
var CHECK_INTERVAL_MS = 15000;
var nextCheckAt = Date.now() + 5000;
var checkInFlight = false;
const $ = id => document.getElementById(id);
function timeText(time) {
    return new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).format(new Date(time));
}
function scaleScreen() {
    const aspect=Math.min(16/8,Math.max(16/10,innerWidth/Math.max(1,innerHeight)));
    const width=Math.max(1920,1080*aspect),height=Math.max(1080,1920/aspect);
    const scale=Math.min(innerWidth/width,innerHeight/height),content=$('reconnecting-content');
    content.style.width=width+'px';content.style.height=height+'px';
    content.style.transform=`scale(${scale})`;
    content.style.left=Math.max(0,(innerWidth-width*scale)/2)+'px';
    content.style.top=Math.max(0,(innerHeight-height*scale)/2)+'px';
}
window.addEventListener('resize',scaleScreen);scaleScreen();
// 列車とバスの片方だけがオンのときは、交通情報の代わりにその発車案内の画面を出す
function screenPath(mode, view) {
    return mode==='transit' && (view==='bus' || view==='train') ? '/transit/board/'+view+'/' : '/'+mode+'/';
}
var currentPath = '/transit/';
// 時計・バス・電車の「測量」から交通情報の画面へ切り替えるときは、起動イントロ「測量」の後半でつなぐ。
// 交通情報の画面を裏の iframe（handoff）で読み込み、準備ができたら「測量」の画面に後半（準急が香里園に止まり、
// 真上へ回り込んで線路が見出しの下線になる）を流させる。終わったら交通情報の画面に組み上げを始めさせ、
// 始まった瞬間に入れ替える。どこかで返事が来なければ、そのまま入れ替える。
const ATLAS_PATHS=['/clock/','/transit/board/bus/','/transit/board/train/'];
const HANDOFF_LIMIT_MS=20000, OUTRO_LIMIT_MS=8000;
var handoff = null;
function handoffAllowed(from, to) {
    return to==='/transit/' && ATLAS_PATHS.includes(from) && $('reconnecting-screen').hidden && !document.hidden
        && !matchMedia('(prefers-reduced-motion: reduce)').matches;
}
function startHandoff(path) {
    const frame=document.createElement('iframe');
    frame.className='next';frame.setAttribute('aria-hidden','true');frame.src=path+'?handoff=atlas';
    $('f').after(frame);
    handoff={frame,outro:false,timer:setTimeout(finishHandoff,HANDOFF_LIMIT_MS),outroTimer:null};
}
function cancelHandoff() {
    if(!handoff)return;
    clearTimeout(handoff.timer);clearTimeout(handoff.outroTimer);handoff.frame.remove();handoff=null;
}
function releaseHandoff() {
    if(!handoff)return;
    clearTimeout(handoff.outroTimer);
    handoff.frame.contentWindow?.postMessage({type:'signage:handoff-go'},location.origin);
}
function finishHandoff() {
    if(!handoff)return;
    const {frame,timer,outroTimer}=handoff;handoff=null;clearTimeout(timer);clearTimeout(outroTimer);
    const old=$('f');old.removeAttribute('id');
    frame.id='f';frame.className='';frame.removeAttribute('aria-hidden');old.remove();
}
window.addEventListener('message',event=>{
    if(!handoff||event.origin!==location.origin)return;
    const data=event.data||{};
    if(event.source===handoff.frame.contentWindow && data.type==='signage:handoff') {
        if(data.state==='ready' && !handoff.outro) {
            handoff.outro=true;
            $('f').contentWindow?.postMessage({type:'signage:outro',rule:data.rule},location.origin);
            handoff.outroTimer=setTimeout(releaseHandoff,OUTRO_LIMIT_MS);
        } else if(['running','completed','skipped'].includes(data.state)) finishHandoff();
    } else if(event.source===$('f').contentWindow && data.type==='signage:outro' && ['done','unavailable'].includes(data.state)) {
        releaseHandoff();
    }
});
// 季節の装飾は controller が決める。画面（iframe）は読み込まれるたびに聞いてくるので答え、変わったら出ている画面に知らせる
var currentSeason = null;
function sendSeason(target) {
    target?.postMessage({type:'signage:season',season:currentSeason},location.origin);
}
function setSeason(season) {
    season=season||null;
    if(season===currentSeason)return;
    currentSeason=season;
    for(const frame of document.querySelectorAll('iframe'))sendSeason(frame.contentWindow);
}
window.addEventListener('message',event=>{
    if(event.origin===location.origin && event.data?.type==='signage:season-request')sendSeason(event.source);
});
function setMode(mode, view) {
    if (!['transit','clock'].includes(mode)) return;
    const path=screenPath(mode, view);
    if (path === currentPath) return;
    const from=currentPath;
    cancelHandoff();
    currentMode=mode;currentPath=path;
    if(typeof sendDisplayInfo==='function')setTimeout(sendDisplayInfo,0);
    if(handoffAllowed(from, path))startHandoff(path);else $('f').src=path;
    lastOk=Date.now();firstFailure=null;failures=0;attempts=[];
    $('reconnecting-screen').hidden=true;
}
function setClockDigits(element, text) {
    if (element.childElementCount !== text.length) {
        element.replaceChildren(...Array.from(text, character => {
            const span = document.createElement('span');
            span.className = character === ':' ? 'clock-separator' : 'clock-digit';
            return span;
        }));
    }
    Array.from(text).forEach((character, index) => {
        element.children[index].textContent = character;
    });
}
function updateDisplay() {
    const now=Date.now(),date=new Date(now);
    const parts=new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',month:'2-digit',day:'2-digit',weekday:'short'}).formatToParts(date);
    const part=type=>parts.find(p=>p.type===type).value,time=timeText(now);
    $('clock-date').textContent=`${part('month')}.${part('day')} ${part('weekday')}`;
    setClockDigits($('clock-time'), time.slice(0,5));setClockDigits($('clock-seconds'), time.slice(5));
    if(firstFailure!==null && now-lastOk>=TIMEOUT_MS)$('reconnecting-screen').hidden=false;
    $('retry-count').textContent=failures;
    const seconds=Math.max(0,Math.ceil((nextCheckAt-now)/1000));
    $('next-retry').textContent=seconds;
    $('retry-progress').style.width=Math.min(100,Math.max(0,(nextCheckAt-now)/CHECK_INTERVAL_MS*100))+'%';
    const elapsed=firstFailure===null?0:Math.max(0,Math.floor((now-firstFailure)/1000));
    $('elapsed-minutes').textContent=Math.floor(elapsed/60);$('elapsed-seconds').textContent=elapsed%60;
    $('failure-since').textContent=firstFailure===null?'—':timeText(firstFailure);
    $('check-target').textContent='/'+currentMode;$('last-ok').textContent=timeText(lastOk);
}
function recordFailure(code,detail) {
    const now=Date.now();if(firstFailure===null)firstFailure=now;failures++;
    attempts.unshift({number:failures,time:now,code,detail});attempts=attempts.slice(0,7);
    const cause=$('failure-cause'),description=$('failure-description');
    if(code==='—') {
        cause.textContent='サーバーまで届きません';
        description.textContent='この画面の端末のネットワークか、外への接続が止まっています。';
    } else if(code===502 && detail==='Upstream unreachable') {
        cause.textContent=`表示サーバー（${currentMode}）が応答しません`;
        description.textContent=`中継（controller）までは届いています。${currentMode} が止まっているか、再起動中です。`;
    } else {
        cause.textContent=`表示サーバー（${currentMode}）がエラーを返しています（HTTP ${code}）`;
        description.textContent='';
    }
    const list=$('attempts');list.replaceChildren();
    for(const attempt of attempts) {
        const row=document.createElement('div');row.className='attempt';
        for(const [value,style] of [[attempt.number,'width:40px;color:#7C7C82;flex-shrink:0'],[timeText(attempt.time),'width:96px;flex-shrink:0'],[attempt.code,'width:48px;color:#FF5B2E;font-weight:500;flex-shrink:0'],[attempt.detail,'']]) {
            const span=document.createElement('span');span.textContent=value;span.style.cssText=style;if(!style)span.className='attempt-detail';row.append(span);
        }
        list.append(row);
    }
    updateDisplay();
}
async function healthCheck() {
    if(checkInFlight)return;
    checkInFlight=true;nextCheckAt=Date.now()+CHECK_INTERVAL_MS;
    const mode=currentMode,controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),10000);
    try {
        const response=await fetch('/'+mode,{signal:controller.signal,cache:'no-store'});
        if(mode!==currentMode)return;
        if(response.status<500) {
            const reconnecting=!$('reconnecting-screen').hidden;
            const outageStart=firstFailure;
            lastOk=Date.now();firstFailure=null;failures=0;attempts=[];
            $('reconnecting-screen').hidden=true;
            if(reconnecting){reportOutage(outageStart);cancelHandoff();$('f').src=currentPath;}
        } else {
            let detail=response.statusText;
            try {const data=await response.json();if(typeof data.detail==='string')detail=data.detail;} catch(error) {if(controller.signal.aborted)throw error;}
            if(mode===currentMode)recordFailure(response.status,detail);
        }
    } catch(error) {
        if(mode===currentMode)recordFailure('—',controller.signal.aborted?'応答なし（10秒でタイムアウト）':'接続できません');
    } finally {clearTimeout(timer);checkInFlight=false;updateDisplay();}
}
// 端末と中の画面で起きたエラーを、同じものは回数にまとめて controller に送る（管理画面の「端末のエラー」）。
// つながらない間は手元に溜めておき、戻ってから送る
const errorQueue=new Map(), ERROR_QUEUE_MAX=50;
function queueError(item){
    const key=[item.kind,item.message,item.source,item.page].join('\n'),queued=errorQueue.get(key);
    if(queued)queued.count+=item.count;else if(errorQueue.size<ERROR_QUEUE_MAX)errorQueue.set(key,item);
}
function reportError(kind,message,source,page,detail){
    queueError({kind,message:String(message||'').slice(0,300),source:String(source||'').slice(0,200),page:String(page||'').slice(0,100),
        detail:detail||'',count:1,build:currentVersion});
}
async function flushErrors(){
    if(!errorQueue.size)return;
    const items=[...errorQueue.values()];errorQueue.clear();
    try{
        const response=await fetch('/api/errors',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(items),cache:'no-store'});
        if(response.status>=500)throw new Error('HTTP '+response.status);
    }catch(error){items.forEach(queueError);}
}
function reportOutage(start){
    if(!start)return;
    const minutes=Math.max(1,Math.round((Date.now()-start)/60000));
    const at=new Date(start).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
    reportError('offline','再接続中の画面になった',$('failure-cause').textContent,currentPath,`${at}から約${minutes}分`);
    setTimeout(flushErrors,1000);
}
window.addEventListener('error',event=>{
    const target=event.target;
    if(target&&target!==window&&(target.src||target.href))reportError('resource',target.tagName.toLowerCase()+' を読み込めません',target.src||target.href,'/');
    else reportError('error',event.message,event.filename?event.filename.replace(location.origin,'')+':'+event.lineno+':'+event.colno:'','/');
},true);
window.addEventListener('unhandledrejection',event=>{
    const reason=event.reason;
    reportError('rejection',reason instanceof Error?reason.message:reason,reason instanceof Error?String(reason.stack||'').split('\n')[1]?.trim():'','/');
});
window.addEventListener('message',event=>{
    if(event.origin!==location.origin||event.data?.type!=='signage:error')return;
    if(![...document.querySelectorAll('iframe')].some(frame=>frame.contentWindow===event.source))return;
    const data=event.data;
    if(['error','rejection','resource'].includes(data.kind))reportError(data.kind,data.message,data.source,data.page);
});
setInterval(flushErrors,15000);
// 新しい版を反映したら（build が変わったら）、端末の画面をまるごと読み直す
var loadedBuild = null;
function checkBuild(data) {
    if (!data.build) return;
    if (loadedBuild === null) { loadedBuild = data.build; setTimeout(sendDisplayInfo,0); return; }
    if (data.build !== loadedBuild) location.reload();
}
// 交通情報の画面は読み込んだときの設定で欄を組むので、表示する情報が変わったら読み直す。
// 「測量」の画面は欄を毎回 API から決めるので、取り直させるだけでよい（読み直すと地図の準備からやり直しになる）
var currentFeatures = null;
function setFeatures(features) {
    if (!features) return;
    const key=JSON.stringify(features), changed=currentFeatures!==null && key!==currentFeatures;
    currentFeatures=key;
    if (!changed || handoff || !$('reconnecting-screen').hidden) return;
    if (currentPath==='/transit/') $('f').src=currentPath;
    else $('f').contentWindow?.postMessage({type:'signage:refresh'},location.origin);
}
var currentVersion = '';
function applyStatus(data) {
    currentVersion=data.version||currentVersion;
    checkBuild(data);setSeason(data.season);
    const path=currentPath;
    setMode(data.mode,data.transit_view);
    // 画面ごと切り替わったときは、新しい画面がいまの設定で読み込まれる
    if (currentPath!==path && data.features) currentFeatures=JSON.stringify(data.features);
    else setFeatures(data.features);
}
fetch('/api/mode').then(r=>r.json()).then(applyStatus).catch(()=>{});
// 途中の Cloudflare がエラーを返すと、ブラウザは EventSource をつなぎ直さなくなる。
// 黙って途切れた接続にも気づけるよう、サーバーは25秒ごとに ping を送り、90秒届かなければつなぎ直す
const EVENTS_SILENCE_MS=90000;
var events=null,lastEventAt=0;
// 管理画面に端末ごとの画面・OSを出すための名乗り。読み直しても同じタブなら同じ id になる
const displayId=(()=>{
    const fresh=()=>(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2));
    try{let id=sessionStorage.getItem('signage-display-id');if(!id){id=fresh();sessionStorage.setItem('signage-display-id',id);}return id;}
    catch(error){return fresh();}
})();
// 端末の時計はずれていることがあるので、時刻ではなく「何ミリ秒前か」を送り、controller の時計で時刻に直す
const pageLoadedAt=Date.now(), tabStartedAt=(()=>{
    try{const saved=Number(sessionStorage.getItem('signage-tab-started'));if(saved>0&&saved<=pageLoadedAt)return saved;sessionStorage.setItem('signage-tab-started',String(pageLoadedAt));}catch(error){}
    return pageLoadedAt;
})();
async function sendDisplayInfo(){
    const info={id:displayId,tab_age_ms:Date.now()-tabStartedAt,page_age_ms:Date.now()-pageLoadedAt,page:currentPath,build:loadedBuild||'',version:currentVersion,screen:[screen.width,screen.height],viewport:[innerWidth,innerHeight],dpr:devicePixelRatio,language:navigator.language};
    try{
        const hints=await navigator.userAgentData?.getHighEntropyValues(['platformVersion','model','fullVersionList']);
        if(hints){
            const brand=(hints.fullVersionList||[]).find(b=>!/Not.?A.?Brand|Chromium/i.test(b.brand))||(hints.fullVersionList||[])[0];
            Object.assign(info,{platform:hints.platform,platform_version:hints.platformVersion,model:hints.model,browser:brand?brand.brand+' '+brand.version:''});
        }
    }catch(error){}
    fetch('/api/displays/info',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(info),cache:'no-store'}).catch(()=>{});
}
let infoTimer=null;
window.addEventListener('resize',()=>{clearTimeout(infoTimer);infoTimer=setTimeout(sendDisplayInfo,2000);});
function connectEvents() {
    if(events)events.close();
    lastEventAt=Date.now();
    events=new EventSource('/api/mode/stream?client=display&id='+encodeURIComponent(displayId));
    // controller を作り直すと手元の情報が消えるので、つなぎ直すたびに送り直す
    events.onopen=sendDisplayInfo;
    events.onmessage=event=>{lastEventAt=Date.now();try{applyStatus(JSON.parse(event.data));}catch(error){}};
    events.addEventListener('ping',()=>{lastEventAt=Date.now();});
}
connectEvents();
