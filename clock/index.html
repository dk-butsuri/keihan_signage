<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>時計</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;400;500;700&display=swap">
    <style>
        html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0B0B0C; }
        #screen {
            position: absolute; left: 50%; top: 50%;
            width: 1920px; height: 1080px; box-sizing: border-box;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 48px;
            color: #F1F1EE; font-family: 'Zen Kaku Gothic New', sans-serif; font-variant-numeric: tabular-nums;
            transform-origin: center;
        }
        .time-row { display: flex; align-items: baseline; gap: 16px; line-height: 0.9; }
        #time { font-size: 400px; font-weight: 300; }
        #seconds { font-size: 140px; font-weight: 300; color: #7C7C82; }
        #time, #seconds { display: inline-flex; white-space: nowrap; }
        .digit { display: inline-block; width: .58em; text-align: center; }
        .separator { display: inline-block; width: .22em; text-align: center; }
        .rule { width: 1280px; height: 1px; background: #26262A; }
        #date { font-size: 52px; font-weight: 400; color: #A1A1A6; letter-spacing: 0.08em; }
        .wx { position: absolute; left: 60px; right: 60px; top: 872px; display: flex; flex-direction: column-reverse; align-items: center; gap: 14px; white-space: nowrap; }
        .wx[hidden] { display: none; }
        .wx-label { display: flex; gap: 14px; align-items: baseline; line-height: 1; }
        .wx-label b { font-size: 18px; font-weight: 500; color: #A1A1A6; letter-spacing: .06em; }
        .wx-label span { font-size: 16px; color: #7C7C82; }
        .wx-items { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px 36px; }
        .wx-item { display: flex; align-items: center; gap: 14px; line-height: 1; }
        .wx-chip { display: inline-flex; align-items: baseline; padding: 9px 16px 10px; border-radius: 4px; font-size: 30px; font-weight: 700; color: #fff; letter-spacing: .02em; }
        .wx-chip .wx-lv { font-size: 18px; font-weight: 500; margin-right: 8px; opacity: .9; }
        .wx-chip.l3 { background: #E8290B; }
        .wx-chip.l4 { background: #A3129E; }
        .wx-chip.l5 { background: #0C000C; box-shadow: inset 0 0 0 2px #fff; }
        .wx-chip.pre { background: transparent; font-weight: 500; }
        .wx-chip.pre .wx-lv { opacity: 1; font-weight: 700; }
        .wx-chip.soon { color: #F2D600; box-shadow: inset 0 0 0 2px #F2D600; }
        .wx-chip.possibility { color: #F1F1EE; box-shadow: inset 0 0 0 2px #7C7C82; }
        .wx-cities { font-size: 26px; font-weight: 500; color: #F1F1EE; }
        .wx-cities i { font-style: normal; color: #7C7C82; margin: 0 1px; }
    </style>
</head>
<body>
    <div id="screen">
        <div class="time-row"><span id="time"></span><span id="seconds"></span></div>
        <div class="rule"></div>
        <div id="date"></div>
        <div class="wx" id="weather" hidden><div class="wx-label"><b data-weather="title">気象警報</b><span data-weather="time"></span><span>出典 気象庁（物理部が加工）</span></div><div class="wx-items" data-weather="items"></div></div>
    </div>
    <script>
        var offset = 0; // ms: Date.now() + offset = 推定NTP時刻

        function fit() {
            var scale = Math.min(innerWidth / 1920, innerHeight / 1080);
            document.getElementById('screen').style.transform = 'translate(-50%, -50%) scale(' + scale + ')';
        }

        function setDigits(element, text) {
            if (element.childElementCount !== text.length) {
                element.replaceChildren.apply(element, Array.from(text, function(character) {
                    var span = document.createElement('span');
                    span.className = character === ':' ? 'separator' : 'digit';
                    return span;
                }));
            }
            Array.from(text).forEach(function(character, index) {
                element.children[index].textContent = character;
            });
        }

        function tick(timestamp) {
            var date = new Date(timestamp);
            var time = new Intl.DateTimeFormat('ja-JP', {timeZone: 'Asia/Tokyo', hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23'}).format(date);
            var parts = new Intl.DateTimeFormat('ja-JP', {timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit', weekday: 'short'}).formatToParts(date);
            var part = function(type) { return parts.find(function(p) { return p.type === type; }).value; };
            setDigits(document.getElementById('time'), time.slice(0, 5));
            setDigits(document.getElementById('seconds'), time.slice(5));
            document.getElementById('date').textContent = part('year') + '.' + part('month') + '.' + part('day') + ' ' + part('weekday');
        }

        // タイマーは境目の少し前に発火することがある。そこで前の秒を出して次を1秒後に予約すると、1秒遅れのまま抜けなくなる
        var timer = null;
        function schedule() {
            var now = Date.now() + offset;
            var second = Math.floor((now + 15) / 1000) * 1000;
            tick(second);
            timer = setTimeout(schedule, second + 1000 - now);
        }

        function sampleOnce() {
            var t0 = performance.now();
            return fetch('/api/time', {cache: 'no-store', signal: AbortSignal.timeout(10000)})
                .then(function(res) {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.json();
                })
                .then(function(data) {
                    var httpRtt = performance.now() - t0;
                    // 全部そろってから Date.now() と比べると、待った分だけずれを小さく見積もる
                    return {
                        offset: data.ts * 1000 + httpRtt / 2 - Date.now(),
                        rtt: httpRtt
                    };
                });
        }

        // 同時に投げると互いの往復を遅らせるので、1回ずつ順に測る
        function syncTime() {
            var best = null, attempts = 0;
            function step() {
                if (attempts++ >= 8) return finish();
                return sampleOnce()
                    .then(function(sample) { if (!best || sample.rtt < best.rtt) best = sample; }, function() {})
                    .then(step);
            }
            function finish() {
                if (!best) {
                    console.warn('[clock] sync failed: keeping previous offset');
                    return;
                }
                offset = best.offset;
                clearTimeout(timer);
                schedule();
                console.log('[clock] synced offset=' + offset.toFixed(1) + 'ms rtt=' + best.rtt.toFixed(1) + 'ms');
            }
            step();
        }

        // 画面の切り替えは controller 経由なので、交通情報（transit）の API も同じ入口から読める
        var weatherData = null, lastWeatherSuccess = 0;
        function fetchWeather() {
            fetch('/transit/api/weather', {cache: 'no-store'})
                .then(function(res) { return res.ok ? res.json() : null; })
                .then(function(data) { if (data) { weatherData = data; lastWeatherSuccess = Date.now(); } })
                .catch(function() {})
                .then(function() {
                    if (Date.now() - lastWeatherSuccess > 600000) weatherData = null;
                    window.renderWeather(document.getElementById('weather'), weatherData);
                    setTimeout(fetchWeather, 60000);
                });
        }
        var weatherScript = document.createElement('script');
        weatherScript.src = '/transit/assets/weather.js';
        weatherScript.onload = fetchWeather;
        document.body.appendChild(weatherScript);

        addEventListener('resize', fit);
        fit();
        schedule();
        syncTime();
        setInterval(syncTime, 5 * 60 * 1000);
    </script>
</body>
</html>
