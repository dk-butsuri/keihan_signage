<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>時計</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;400&display=swap">
    <style>
        html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0B0B0C; }
        #screen {
            position: absolute; left: 50%; top: 50%;
            width: 1920px; height: 1080px; box-sizing: border-box;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 48px;
            color: #F1F1EE; font-family: 'Zen Kaku Gothic New', sans-serif; font-variant-numeric: tabular-nums;
            transform-origin: center;
        }
        .time-row { display: flex; align-items: baseline; gap: 16px; line-height: 0.9; }
        #time { font-size: 400px; font-weight: 300; }
        #seconds { font-size: 140px; font-weight: 300; color: #7C7C82; }
        #time, #seconds { display: inline-flex; white-space: nowrap; }
        .digit { display: inline-block; width: .58em; text-align: center; }
        .separator { display: inline-block; width: .22em; text-align: center; }
        .rule { width: 1280px; height: 1px; background: #26262A; }
        #date { font-size: 52px; font-weight: 400; color: #A1A1A6; letter-spacing: 0.08em; }
    </style>
</head>
<body>
    <div id="screen">
        <div class="time-row"><span id="time"></span><span id="seconds"></span></div>
        <div class="rule"></div>
        <div id="date"></div>
    </div>
    <script>
        var offset = 0; // ms: Date.now() + offset = 推定NTP時刻

        function fit() {
            var scale = Math.min(innerWidth / 1920, innerHeight / 1080);
            document.getElementById('screen').style.transform = 'translate(-50%, -50%) scale(' + scale + ')';
        }

        function setDigits(element, text) {
            if (element.childElementCount !== text.length) {
                element.replaceChildren.apply(element, Array.from(text, function(character) {
                    var span = document.createElement('span');
                    span.className = character === ':' ? 'separator' : 'digit';
                    return span;
                }));
            }
            Array.from(text).forEach(function(character, index) {
                element.children[index].textContent = character;
            });
        }

        function tick() {
            var date = new Date(Date.now() + offset);
            var time = new Intl.DateTimeFormat('ja-JP', {timeZone: 'Asia/Tokyo', hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23'}).format(date);
            var parts = new Intl.DateTimeFormat('ja-JP', {timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit', weekday: 'short'}).formatToParts(date);
            var part = function(type) { return parts.find(function(p) { return p.type === type; }).value; };
            setDigits(document.getElementById('time'), time.slice(0, 5));
            setDigits(document.getElementById('seconds'), time.slice(5));
            document.getElementById('date').textContent = part('year') + '.' + part('month') + '.' + part('day') + ' ' + part('weekday');
        }

        function schedule() {
            var corrected = Date.now() + offset;
            var delay = 1000 - (corrected % 1000);
            setTimeout(function() { tick(); schedule(); }, delay);
        }

        function sampleOnce() {
            var t0 = performance.now();
            return fetch('/api/time', {cache: 'no-store'})
                .then(function(res) {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.json();
                })
                .then(function(data) {
                    var t1 = performance.now();
                    var httpRtt = t1 - t0;
                    return {
                        estimated: data.ts * 1000 + httpRtt / 2,
                        errorBound: (httpRtt + data.ntp_rtt_ms) / 2
                    };
                });
        }

        function syncTime() {
            var promises = [];
            for (var i = 0; i < 8; i++) promises.push(sampleOnce());
            Promise.allSettled(promises).then(function(results) {
                var samples = results
                    .filter(function(r) { return r.status === 'fulfilled'; })
                    .map(function(r) { return r.value; });
                if (samples.length === 0) {
                    console.warn('[clock] sync failed: all samples errored, falling back to local clock');
                    offset = 0;
                    return;
                }
                var best = samples.reduce(function(a, b) {
                    return a.errorBound < b.errorBound ? a : b;
                });
                offset = best.estimated - Date.now();
                if (best.errorBound > 100) console.warn('[clock] high error bound: ' + best.errorBound.toFixed(1) + 'ms');
                console.log('[clock] synced offset=' + offset.toFixed(1) + 'ms error≤' + best.errorBound.toFixed(1) + 'ms (' + samples.length + '/8)');
            });
        }

        addEventListener('resize', fit);
        fit();
        syncTime();
        setInterval(syncTime, 5 * 60 * 1000);
        tick();
        schedule();
    </script>
</body>
</html>
