<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400&amp;family=Noto+Sans+JP:wght@400;500&amp;family=Zen+Kaku+Gothic+New:wght@300;400;500;700&amp;display=swap">
<title>{{ demo.title }} · 京阪サイネージ</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0B0B0C;color:#F1F1EE;font:16px/1.6 'Zen Kaku Gothic New',system-ui,sans-serif}main{max-width:1320px;margin:auto;padding:28px 32px 40px}a{color:#D9D9D6}header nav{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px}h1{font-size:28px;line-height:1.4;font-weight:500;margin:20px 0 8px}.description{color:#A1A1A6;margin:0 0 20px}.choice{display:flex;gap:10px;align-items:center;min-width:0}select,button{font:inherit;min-height:44px;padding:6px 12px;background:#202024;color:#F1F1EE;border:1px solid #4A4A50;border-radius:4px}select{min-width:0;max-width:100%}button:disabled{opacity:.5}:focus-visible{outline:2px solid #F1F1EE;outline-offset:3px}@media(max-width:680px){main{padding:20px 16px 32px}.choice{width:100%}.choice select{flex:1}h1{font-size:24px}.description{font-size:14px}}
#atlas-clock{display:grid;gap:12px}
#atlas-clock button[data-action=fullscreen]{background:#F1F1EE;color:#151517}
#atlas-clock [role=status],#atlas-clock .clock-credit{font-size:14px;color:#A1A1A6}
#atlas-clock [role=alert]{color:#F3AAAA}
#atlas-clock .clock-stage{position:relative;isolation:isolate;aspect-ratio:16/9;background:#0B0B0C;overflow:hidden;font-family:'Zen Kaku Gothic New','Noto Sans JP',sans-serif}
#atlas-clock .clock-stage:fullscreen{aspect-ratio:auto;width:100vw;height:100vh;cursor:none}
#atlas-clock .clock-map,#atlas-clock .clock-overlay{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;pointer-events:none}
#atlas-clock .clock-overlay{opacity:0;white-space:nowrap;font-variant-numeric:tabular-nums}
#atlas-clock .clock-date{position:absolute;left:120px;top:356px;font-size:36px;font-weight:400;letter-spacing:.08em;line-height:1;color:#A1A1A6}
#atlas-clock .clock-row{position:absolute;left:104px;top:420px;display:flex;align-items:baseline;gap:14px;font-weight:300;line-height:.9}
#atlas-clock .clock-time{display:inline-flex;font-size:320px;color:#F1F1EE}
#atlas-clock .clock-seconds{display:inline-flex;font-size:116px;color:#7C7C82}
#atlas-clock .clock-digit{display:inline-block;flex:0 0 .58em;width:.58em;text-align:center}
#atlas-clock .clock-separator{display:inline-block;flex:0 0 .22em;width:.22em;text-align:center}
#atlas-clock [hidden]{display:none!important}
#atlas-clock .clock-info{transition:opacity .8s}
#atlas-clock .clock-info.is-waiting{opacity:0}
/* 気象警報: 出ているときだけ、日付の上に。 */
#atlas-clock .wx{position:absolute;left:120px;bottom:752px;display:flex;align-items:flex-end;gap:24px}
#atlas-clock .wx-label{display:flex;flex-direction:column;gap:7px;line-height:1;padding-bottom:6px}
#atlas-clock .wx-label b{font-size:16px;font-weight:500;color:#A1A1A6;letter-spacing:.1em}
#atlas-clock .wx-label span{font-size:13px;color:#7C7C82}
#atlas-clock .wx-items{display:flex;flex-direction:column;gap:8px;padding-left:24px;border-left:1px solid rgba(241,241,238,.14)}
#atlas-clock .wx.many .wx-items{display:grid;grid-auto-flow:column;grid-template-rows:auto auto;column-gap:28px}
#atlas-clock .wx-item{display:flex;align-items:center;gap:12px;line-height:1}
#atlas-clock .wx-chip{display:inline-flex;align-items:baseline;padding:6px 11px 7px;border-radius:3px;font-size:20px;font-weight:700;color:#fff;letter-spacing:.02em}
#atlas-clock .wx-chip .wx-lv{font-size:13px;font-weight:500;margin-right:7px;opacity:.9}
#atlas-clock .wx-chip.l3{background:#E8290B}
#atlas-clock .wx-chip.l4{background:#A3129E}
#atlas-clock .wx-chip.l5{background:#0C000C;box-shadow:inset 0 0 0 2px #fff}
#atlas-clock .wx-chip.pre{background:transparent;font-weight:500}
#atlas-clock .wx-chip.pre .wx-lv{opacity:1;font-weight:700}
#atlas-clock .wx-chip.soon{color:#F2D600;box-shadow:inset 0 0 0 1px #F2D600}
#atlas-clock .wx-chip.possibility{color:#F1F1EE;box-shadow:inset 0 0 0 1px #7C7C82}
#atlas-clock .wx-cities{font-size:19px;font-weight:500;color:#F1F1EE}
#atlas-clock .wx-cities i{font-style:normal;color:#7C7C82;margin:0 1px}
/* 運行情報: 時刻の下に細い線を引いて、その下に1行。平常のときは灰色のまま。 */
#atlas-clock .ops{position:absolute;left:120px;top:760px;width:980px;padding-top:22px;border-top:1px solid rgba(241,241,238,.14)}
#atlas-clock .ops-groups{display:flex;flex-wrap:wrap;align-items:center;gap:10px 26px;font-size:19px;line-height:1;color:#7C7C82}
#atlas-clock .ops-title{font-size:15px;letter-spacing:.14em;margin-right:4px}
#atlas-clock .ops-group{display:flex;align-items:center;gap:8px}
#atlas-clock .ops-mark{width:9px;height:9px;border:1.5px solid currentColor;border-radius:50%;opacity:.8}
#atlas-clock .ops-group.is-unknown .ops-mark{width:9px;height:0;border-width:1.5px 0 0;border-radius:0}
#atlas-clock .ops-group.is-warning{color:#F1F1EE}
#atlas-clock .ops-group.is-warning .ops-mark{width:auto;height:auto;border:0;opacity:1;font-size:17px;font-weight:700;color:#FF5B2E}
#atlas-clock .ops-status{color:#FF5B2E;font-weight:500}
#atlas-clock .ops-lines{display:grid;grid-template-columns:330px 150px 1fr;gap:10px 18px;margin-top:20px;font-family:'Noto Sans JP',sans-serif;font-size:18px;line-height:1}
#atlas-clock .ops-lines>span:nth-child(3n+1){color:#F1F1EE}
#atlas-clock .ops-lines>span:nth-child(3n+2){color:#FF5B2E;font-weight:500}
#atlas-clock .ops-lines>span:nth-child(3n){color:#7C7C82;font-size:14px;align-self:center;font-variant-numeric:tabular-nums}
/* 次に切り替わるまでの残りを、左から伸びる線で見せる。 */
#atlas-clock .ops-foot{grid-column:1/-1;display:flex;align-items:center;gap:14px;margin-top:4px}
#atlas-clock .ops-bar{position:relative;width:480px;height:2px;background:rgba(241,241,238,.14);overflow:hidden}
#atlas-clock .ops-bar i{position:absolute;inset:0;background:#A1A1A6;transform-origin:0 50%;transform:scaleX(0)}
#atlas-clock .ops-page{color:#A1A1A6;font-size:14px;letter-spacing:.08em;font-variant-numeric:tabular-nums}
#atlas-clock .clock-controls{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
#atlas-clock .clock-controls label{display:flex;gap:8px;align-items:center}
#atlas-clock .clock-credit{margin:0}
</style>
</head>
<body><main>
<header><nav aria-label="デモの選択"><a id="clock-back" href="/demo">← デモ一覧</a><label class="choice">デモ<select id="clock-demo" aria-label="デモ選択">{% for item in demos %}<option value="{{ item.id }}" {% if item.id == demo.id %}selected{% endif %} {% if not item.available %}disabled{% endif %}>{{ item.title }}</option>{% endfor %}</select></label></nav><h1>{{ demo.title }}</h1><p class="description">{{ demo.description }}</p></header>

<div id="atlas-clock">
  <div class="clock-stage" role="img" aria-label="時計「測量」。左に日付と大きな時刻。時刻の下に運行情報が1行で並び、気象警報が出ているときは日付の上に札が出ます。背景では、同志社香里と香里園のまわりの地形・道路・建物が線だけの立体で描かれ、視点がゆっくり回り続ける。20秒ごとに学校と駅から交互に波が広がって線が光り、京阪本線の上を種別の色の光が行き交います。"><canvas class="clock-map" width="1920" height="1080" aria-hidden="true"></canvas><div class="clock-overlay" aria-hidden="true"><div class="clock-info is-waiting"><div class="wx" hidden><div class="wx-label"><b data-weather="title">気象警報</b><span data-weather="time"></span><span>出典 気象庁（物理部が加工）</span></div><div class="wx-items" data-weather="items"></div></div></div><div class="clock-date"></div><div class="clock-row"><span class="clock-time"></span><span class="clock-seconds"></span></div><div class="clock-info is-waiting"><div class="ops" hidden><div class="ops-groups"></div><div class="ops-lines" hidden></div></div></div></div></div>
  <div class="clock-controls">
    <button type="button" data-action="fullscreen" disabled>全画面で表示</button>
    <button type="button" data-action="restart" disabled>立ち上げからやり直す</button>
    <label>運行情報と気象警報<select data-info aria-label="運行情報と気象警報"><option value="live">実際の情報</option><option value="sample">想定（荒天の日）</option></select></label>
    <span role="status" aria-live="polite">地図を準備中</span>
  </div>
  <p class="clock-credit">地図データ © OpenStreetMap contributors（ODbL）／標高 国土地理院 基盤地図情報数値標高モデル（5mメッシュ）を加工。線路の上を走る光は飾りで、実際の列車の位置ではありません。運行情報と気象警報は実際の情報です（「想定」を選ぶと、荒天の日の見え方を確かめられます）。</p>
</div>
</main><script>
const base=location.pathname.replace(/\/$/,''),catalog=base.slice(0,base.lastIndexOf('/'));
document.getElementById('clock-back').href=catalog;
document.getElementById('clock-demo').addEventListener('change',event=>location.assign(catalog+'/'+event.target.value));
const script=document.createElement('script');script.src=base+'/player.js';
script.onerror=()=>{const status=document.querySelector('#atlas-clock [role=status]');status.textContent='時計を読み込めませんでした。再読み込みしてください。';status.setAttribute('role','alert');};
document.body.append(script);
</script></body></html>
