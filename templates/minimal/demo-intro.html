#tankyu-intro{display:grid;gap:12px}
#tankyu-intro .intro-stage{position:relative;aspect-ratio:16/9;background:#0B0B0C;overflow:hidden}
#tankyu-intro .intro-pixels{position:absolute;z-index:1;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
#tankyu-intro .intro-board{position:absolute;z-index:0;left:0;top:0;width:1920px;height:1080px;border:0;transform-origin:0 0;pointer-events:none;visibility:hidden}
#tankyu-intro .intro-layer{position:absolute;inset:0;background:#0f1017}
#tankyu-intro .intro-peripheral{background:rgb(13.5,14.4,20.7)}
#tankyu-intro canvas{position:absolute;display:block;pointer-events:none}
#tankyu-intro .intro-main{left:0;top:0;width:1920px;height:1080px;will-change:transform,opacity}
#tankyu-intro .intro-group{left:704px;top:460px;width:512px;height:160px;will-change:transform,opacity,filter}
#tankyu-intro .intro-controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#tankyu-intro .intro-scrub{display:grid;gap:4px;min-width:0}
#tankyu-intro .intro-readout{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-variant-numeric:tabular-nums}

<body><main>
<header><nav aria-label="デモの選択"><a id="intro-back" href="/demo">← デモ一覧</a><label class="choice">デモ<select id="intro-demo" aria-label="デモ選択">{% for item in demos %}<option value="{{ item.id }}" {% if item.id == demo.id %}selected{% endif %} {% if not item.available %}disabled{% endif %}>{{ item.title }}</option>{% endfor %}</select></label></nav><h1>{{ demo.title }}</h1></header>

<div id="tankyu-intro">
  <div class="intro-stage" role="img" aria-label="起動イントロ。探究1A-2班の文字が現れ、京阪電車・京阪バス 発車時刻リアルタイムサイネージ設置プロジェクトに切り替わり、続いて発車案内が左から組み上がります。"><div class="intro-pixels"><div class="intro-layer intro-source"></div><div class="intro-layer intro-peripheral"></div></div></div>
  <div class="intro-controls">
    <button type="button" data-action="play" disabled>最初から再生</button>
    <button type="button" data-action="restart" disabled>やり直す</button>
    <button type="button" data-action="transition" disabled>つなぎから</button>
    <button type="button" data-action="previous" aria-label="1フレーム戻る" disabled>−1 F</button>
    <button type="button" data-action="next" aria-label="1フレーム進む" disabled>＋1 F</button>
    <span role="status" aria-live="polite">フォントを準備中</span>
  </div>
  <div class="intro-scrub">
    <div class="intro-readout"><label for="tankyu-intro-frame">再生位置 <output data-time aria-live="off">0.00 / 9.03 秒</output></label><span data-phase>イントロ</span><output data-frame aria-live="off">0 / 541 F · 60 fps</output></div>
    <input id="tankyu-intro-frame" type="range" min="0" max="541" step="1" value="0" disabled>
  </div>
</div>
</main><script>
const base=location.pathname.replace(/\/$/,''),catalog=base.slice(0,base.lastIndexOf('/'));
document.getElementById('intro-back').href=catalog;
document.getElementById('intro-demo').addEventListener('change',event=>location.assign(catalog+'/'+event.target.value));
const script=document.createElement('script');script.type='module';script.src=base+'/player.js';
script.onerror=()=>{const status=document.querySelector('#tankyu-intro [role=status]');status.textContent='イントロを読み込めませんでした。再読み込みしてください。';status.setAttribute('role','alert');};
document.body.append(script);
</script></body></html>
